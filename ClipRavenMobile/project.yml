name: ClipRavenMobile
options:
  bundleIdPrefix: com.lumibear
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ClipRavenMobile:
    type: application
    platform: iOS
    sources:
      - path: ClipRavenMobile
        excludes:
          - "Info.plist"
          - "ClipRavenMobile.entitlements"
    resources:
      - path: ClipRavenMobile/Assets.xcassets
      - path: ClipRavenMobile/Preview Content/Preview Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumibear.ClipRavenMobile
        PRODUCT_NAME: ClipRavenMobile
        INFOPLIST_FILE: ClipRavenMobile/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClipRavenMobile/ClipRavenMobile.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_ASSET_PATHS: "\"ClipRavenMobile/Preview Content\""
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic

  ClipRavenWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumibear.ClipRavenMobile.widget
        PRODUCT_NAME: ClipRavenWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ClipRaven Widget
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 LumiBear Studio"
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/WidgetExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - package: GRDB
      - package: ClipRavenSync
