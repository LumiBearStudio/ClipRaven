name: ClipRaven

options:
  bundleIdPrefix: com.lumibear
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.4"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.5.0"
  xxHash-Swift:
    url: https://github.com/daisuke-t-jp/xxHash-Swift
    from: "1.1.0"

targets:
  ClipRaven:
    type: application
    platform: macOS
    sources:
      - ClipRaven
    entitlements:
      path: ClipRaven/Resources/ClipRaven.entitlements
    settings:
      base:
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_LSUIElement: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: GRDB
        product: GRDB
      - package: xxHash-Swift
        product: xxHash-Swift

  ClipRavenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClipRavenTests
    dependencies:
      - target: ClipRaven
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
